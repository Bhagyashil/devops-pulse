version: '3.8'
services:
  mongo:
    image: mongo:6
    container_name: devops-pulse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devops-pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  server:
    build: ./server
    container_name: devops-pulse-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  client:
    build: ./client
    container_name: devops-pulse-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:

